[workspace]
name = "crs-workspace"
version = "0.1.0"
description = "Computational chemistry in Rust"
authors = ["Pedro Juan Royo <pedro.juan.royo@google.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
rust = ">=1.96.0"
clang = "*"
make = "*"

[feature.dev.dependencies]
prek = "*"

[environments]
dev = { features = ["dev"] }

[tasks]
build = { description = "Build the workspace", cmd = ["cargo", "build", "--all"] }
test = { description = "Run tests", cmd = ["cargo", "test", "--all"] }
format = { description = "Format the code", cmd = ["cargo", "fmt", "--all"] }
lint = { description = "Run linter", cmd = ["cargo", "clippy", "--all", "--all-targets", "--all-features", "--", "-D", "warnings"] }
dev-setup = { description = "Setup development environment", cmd = ["prek", "install"], default-environment = "dev" }
